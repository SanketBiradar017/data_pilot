[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datapilot-ai"
version = "1.0.0"
description = "Autonomous Multi-Agent Data Analytics and Research Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
    "langgraph>=1.2.18",
    "reportlab>=5.1.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-docx>=1.2.0",
    "pypdf>=6.21.4",
    "xlsxwriter>=3.3.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E702", "E731"]
