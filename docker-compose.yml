services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot}
      POSTGRES_DB: datapilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://datapilot:${POSTGRES_PASSWORD:-datapilot}@db:5432/datapilot
      APP_ENV: production
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  pgdata:
